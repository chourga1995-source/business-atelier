  --card:#0D1C2F;--card2:#102338;--muted:#8D98A6;--muted2:#5F6C7B;
  --green:#5FA88A;--red:#D0676C;--amber:#D9B36C;--blue:#7D8FA6;
  --serif:"GFS Baskerville","Baskerville","Libre Baskerville","Didot",Georgia,serif;
  --num:"Inter","Segoe UI",-apple-system,Roboto,Arial,sans-serif;
  --sans:"Inter","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif;
  --r:14px;--sbw:248px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--black);color:var(--ivory);font-family:var(--sans);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1,"cv11" 1}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(1200px 600px at 85% -10%,rgba(197,166,106,.07),transparent 60%),
  radial-gradient(900px 700px at 10% 110%,rgba(20,40,61,.55),transparent 60%),linear-gradient(180deg,#081120 0%,#070B11 100%)}
a{color:var(--gold)}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
.app{position:relative;z-index:1;display:flex;min-height:100vh}
/* ---------- sidebar ---------- */
.sb{width:var(--sbw);flex:0 0 var(--sbw);background:linear-gradient(180deg,#060A10,#08101B);border-right:1px solid var(--gold-line);
  position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column;padding:22px 14px 16px}
.brand{display:flex;gap:12px;align-items:center;padding:0 8px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.mono{width:40px;height:40px;flex:0 0 40px}
.brand b{display:block;font-family:var(--serif);font-weight:400;font-size:17px;letter-spacing:.02em;color:var(--ivory);line-height:1.15}
.brand small{display:block;font-size:9px;letter-spacing:.24em;color:var(--gold);text-transform:uppercase;margin-top:3px}
.nav-g{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted2);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:9px;color:#C9CED4;text-decoration:none;font-size:13.2px;
  border:1px solid transparent;transition:.15s}
.nav a svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;opacity:.8;flex:0 0 16px}
.nav a:hover{background:rgba(255,255,255,.03);color:var(--ivory)}
.nav a.on{background:linear-gradient(90deg,rgba(197,166,106,.16),rgba(197,166,106,.03));border-color:var(--gold-line);color:var(--ivory)}
.nav a.on svg{stroke:var(--gold);opacity:1}
.nav a .cnt{margin-left:auto;font-size:10px;background:rgba(208,103,108,.18);color:#F0B5B8;border-radius:20px;padding:1px 7px}
.sb-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 8px var(--green)}
/* ---------- main ---------- */
.main{flex:1;min-width:0;padding:26px 34px 60px}
.topbar{display:none}
@supports(padding:env(safe-area-inset-top)){.sb{padding-top:calc(22px + env(safe-area-inset-top))}}
.ph{display:flex;align-items:flex-end;gap:18px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px;padding-bottom:16px;border-bottom:1px solid var(--gold-line)}
.ph .eyebrow{font-size:10px;letter-spacing:.26em;color:var(--gold);text-transform:uppercase}
.ph h1{font-family:var(--serif);font-weight:400;font-size:34px;margin:4px 0 2px;letter-spacing:.01em;line-height:1.1}
.ph p{margin:0;color:var(--muted);font-size:13px;max-width:720px}
.ph .act{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{background:transparent;border:1px solid var(--gold-line);color:var(--ivory);padding:8px 14px;border-radius:9px;cursor:pointer;font-size:12.5px;
  display:inline-flex;align-items:center;gap:7px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--gold);background:var(--gold-soft)}
a.btn{text-decoration:none}
.btn.gold{background:linear-gradient(180deg,#D3B67C,#B8975A);border-color:#D3B67C;color:#0A0E14;font-weight:600}
.btn.gold:hover{filter:brightness(1.06)}
.btn.sm{padding:5px 10px;font-size:11.5px}
.btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.7}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--gold-line);border-radius:30px;padding:5px 12px;font-size:11.5px;color:#D9D3C6;background:rgba(9,22,38,.6)}
.chip select{background:transparent;border:0;color:var(--gold);font-weight:600;outline:none;cursor:pointer}
.chip select option{background:var(--night);color:var(--ivory)}
/* ---------- cards ---------- */
.grid{display:grid;gap:16px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid rgba(197,166,106,.13);border-radius:var(--r);padding:18px 20px;
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 18px 40px -24px rgba(0,0,0,.8);min-width:0}
.card h3{margin:0 0 2px;font-family:var(--serif);font-weight:400;font-size:18px;letter-spacing:.01em}
.card .ch{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.card .ch small{color:var(--muted);font-size:11.5px}
.kpi{position:relative;overflow:hidden;padding:16px 18px 14px}
.kpi::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,var(--gold),rgba(197,166,106,.15))}
.kpi.link{display:block;text-decoration:none;color:inherit;cursor:pointer;transition:.15s}
.kpi.link:hover,.kpi.link:active{border-color:var(--gold);transform:translateY(-1px)}
.kpi .go{float:right;color:var(--gold);font-size:14px;line-height:1;opacity:.7}
.kpi .l{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
.kpi .v{font-family:var(--num);font-weight:300;letter-spacing:-.02em;font-size:29px;line-height:1.1;margin:8px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .s{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;color:var(--muted);align-items:center}
.kpi .s b{color:var(--gold);font-weight:600}
.lbl{font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:600}
.up{color:var(--green)!important}.dn{color:var(--red)!important}
.mini{padding:12px 14px}.mini .v{font-size:22px;margin:5px 0 0}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.06);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#9E8250,var(--gold));border-radius:6px}
.bar.r i{background:linear-gradient(90deg,#9E4A4F,var(--red))}
.sec{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin:26px 0 12px;display:flex;align-items:center;gap:12px}
.sec::after{content:"";flex:1;height:1px;background:var(--gold-line)}
/* ---------- tables ---------- */
.tw{overflow:auto;border-radius:12px;border:1px solid rgba(197,166,106,.13);background:rgba(7,11,17,.45);max-height:70vh}
table.t{border-collapse:separate;border-spacing:0;width:100%;min-width:100%;font-size:12.8px}
.t th{position:sticky;top:0;z-index:2;background:#12253A;color:var(--gold);font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  text-align:left;padding:11px 10px;border-bottom:1px solid var(--gold-line);white-space:nowrap;cursor:pointer;user-select:none}
.t th.calc{color:#E9D9B2;background:#1A2E44}
.t th.calc::after{content:" ◆";font-size:7px;vertical-align:2px;color:var(--gold)}
.t th.num,.t td.num{text-align:right}
.t td{padding:0;border-bottom:1px solid var(--line);white-space:nowrap;height:38px}
.t tr:nth-child(even) td{background:rgba(255,255,255,.012)}
.t tr:hover td{background:rgba(197,166,106,.05)}
.t td .cv{padding:0 10px;color:#E8DCC0}
.t input,.t select{width:100%;min-width:90px;height:38px;background:transparent;border:0;outline:none;padding:0 10px;color:var(--ivory)}
.t input[type=date]{min-width:128px;color-scheme:dark}
.t input.num{text-align:right}
.t input:focus,.t select:focus{background:rgba(197,166,106,.09);box-shadow:inset 0 -2px 0 var(--gold)}
.t select option{background:var(--night);color:var(--ivory)}
.t select.hasb{color:transparent}
.t td.first{position:sticky;left:0;z-index:1;background:#0B1828!important}
.t th.first{position:sticky;left:0;z-index:3}
.t td.x{width:34px;text-align:center}
.del{background:none;border:0;color:var(--muted2);cursor:pointer;font-size:16px;line-height:1;padding:6px}
.del:hover{color:var(--red)}
.t tfoot td{background:#12253A!important;font-weight:600;color:var(--gold);padding:10px;position:sticky;bottom:0}
.badge{white-space:nowrap;display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;padding:3px 9px;border-radius:20px;border:1px solid;line-height:1.3}
.b-g{color:var(--green);border-color:rgba(95,168,138,.4);background:rgba(95,168,138,.1)}
.b-r{color:#EE9A9E;border-color:rgba(208,103,108,.45);background:rgba(208,103,108,.12)}
.b-a{color:var(--amber);border-color:rgba(217,179,108,.4);background:rgba(217,179,108,.1)}
.b-gold{color:#0A0E14;border-color:var(--gold);background:var(--gold)}
.b-m{color:var(--muted);border-color:rgba(141,152,166,.3);background:rgba(141,152,166,.07)}
.b-i{color:var(--ivory);border-color:rgba(244,240,232,.25);background:rgba(244,240,232,.05)}
tr.row-r td{background:rgba(208,103,108,.06)!important}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 12px}
.search{flex:1;min-width:180px;max-width:340px;position:relative}
.search input{width:100%;background:rgba(7,11,17,.6);border:1px solid var(--gold-line);border-radius:9px;padding:8px 12px 8px 32px;outline:none}
.search input:focus{border-color:var(--gold)}
.search svg{position:absolute;left:10px;top:9px;width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.note{font-size:11.5px;color:var(--muted);margin-top:10px}
.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}
/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.f label{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;background:rgba(7,11,17,.55);border:1px solid var(--gold-line);border-radius:9px;padding:9px 11px;outline:none;color:var(--ivory)}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--gold)}
.f small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.f select option{background:var(--night)}
.f textarea{min-height:120px;resize:vertical;line-height:1.5}
input[type=date]{color-scheme:dark}
/* ---------- charts ---------- */
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:var(--sans);fill:var(--muted);font-size:10.5px}
.tip{position:fixed;z-index:99;pointer-events:none;background:#050910;border:1px solid var(--gold);color:var(--ivory);padding:7px 10px;border-radius:8px;
  font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.6);opacity:0;transition:opacity .1s;white-space:nowrap}
.tip b{color:var(--gold);font-weight:600}
.hb{display:grid;grid-template-columns:minmax(90px,1.2fr) 2fr auto;gap:8px 12px;align-items:center;font-size:12.5px}
.hb .tr{height:8px;border-radius:8px;background:rgba(255,255,255,.05);overflow:hidden}
.hb .tr i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,#8C7442,var(--gold))}
.hb .n{color:#E8DCC0;text-align:right;font-variant-numeric:tabular-nums}
.alerts .a{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;gap:10px}
.alerts .a:last-child{border-bottom:0}
.alerts .a span{display:flex;align-items:center;gap:10px;color:#D6D0C4}
.alerts .a em{font-style:normal;font-family:var(--num);font-weight:300;font-size:18px}
.alerts .a a{font-size:11px;text-decoration:none;letter-spacing:.06em}
.sev{width:8px;height:8px;border-radius:50%;background:var(--muted2)}
.sev.r{background:var(--red);box-shadow:0 0 10px var(--red)}.sev.a{background:var(--amber)}.sev.g{background:var(--green)}
/* kanban */
.kb{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.kc{background:rgba(7,11,17,.5);border:1px solid rgba(197,166,106,.13);border-radius:12px;padding:10px;min-height:160px}
.kc.over{border-color:var(--gold);background:rgba(197,166,106,.06)}
.kc h4{margin:2px 4px 10px;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between}
.kc h4 span{color:var(--muted);letter-spacing:0}
.deal{background:linear-gradient(180deg,#132940,#0F2136);border:1px solid var(--line);border-radius:10px;padding:10px 11px;margin-bottom:8px;cursor:grab;font-size:12.5px}
.deal b{display:block;font-weight:600;margin-bottom:3px}
.deal .m{display:flex;flex-wrap:wrap;gap:4px;justify-content:space-between;color:var(--muted);font-size:11.5px}
.deal .m strong{color:var(--gold);font-weight:600}
/* gantt */
.gantt{display:grid;grid-template-columns:minmax(140px,220px) repeat(12,minmax(34px,1fr));font-size:11.5px;border:1px solid rgba(197,166,106,.13);border-radius:12px;overflow:hidden}
.gantt>div{padding:7px 8px;border-bottom:1px solid var(--line);border-right:1px solid rgba(255,255,255,.025);position:relative;min-height:32px}
.gantt .gh{background:#12253A;color:var(--gold);font-size:10px;letter-spacing:.12em;text-transform:uppercase;text-align:center}
.gantt .gh.cur{background:var(--gold);color:#0A0E14;font-weight:700}
.gantt .gn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#D6D0C4}
.gantt .on{background:linear-gradient(90deg,rgba(197,166,106,.85),rgba(197,166,106,.6));border-right-color:rgba(197,166,106,.4)}
.gantt .on.live{background:linear-gradient(90deg,#E3C98F,var(--gold))}
/* weekly */
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:10px;overflow-x:auto}
.day{background:rgba(7,11,17,.5);border:1px solid rgba(197,166,106,.13);border-radius:12px;padding:10px;min-height:220px}
.day.today{border-color:var(--gold);box-shadow:0 0 0 1px rgba(197,166,106,.25) inset}
.day h4{margin:0 0 8px;font-size:10px;letter-spacing:.2em;color:var(--gold);text-transform:uppercase;display:flex;justify-content:space-between}
.day h4 span{color:var(--muted);letter-spacing:.04em}
.task{display:flex;gap:8px;align-items:flex-start;padding:7px 6px;border-radius:8px;border:1px solid var(--line);margin-bottom:6px;background:rgba(255,255,255,.015);font-size:12.3px}
.task input[type=checkbox]{accent-color:var(--gold);margin-top:2px;flex:0 0 auto}
.task .tx{flex:1;min-width:0}
.task .tx input{width:100%;background:transparent;border:0;outline:none;padding:0}
.task .meta{font-size:10.5px;color:var(--muted);margin-top:2px}
.task.done .tx input{text-decoration:line-through;color:var(--muted)}
.task .del{padding:0 2px;font-size:13px}
.addt{width:100%;background:transparent;border:1px dashed var(--gold-line);color:var(--muted);border-radius:8px;padding:6px;cursor:pointer;font-size:11.5px}
.addt:hover{color:var(--gold);border-color:var(--gold)}
/* ring */
.ring{display:flex;align-items:center;gap:14px}
.ring svg{width:76px;height:76px;flex:0 0 76px}
.goal .ttl{font-size:13.5px;font-weight:600;margin-bottom:2px}
.goal .sub{font-size:11.5px;color:var(--muted)}
/* pricing */
.price-big{font-family:var(--num);font-weight:300;letter-spacing:-.03em;font-size:52px;color:var(--gold);line-height:1;margin:6px 0}
.stack{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:14px 0 8px}
.stack i{display:block;height:100%}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.kv span{color:var(--muted)}
.kv .badge{white-space:nowrap;align-self:center;flex:0 0 auto}.kv b{font-weight:600}
/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(3,6,10,.78);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{max-width:560px;width:100%;background:linear-gradient(180deg,#10233A,#0A1727);border:1px solid var(--gold-line);border-radius:18px;padding:34px;text-align:center;
  box-shadow:0 40px 80px rgba(0,0,0,.7)}
.modal h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:14px 0 6px}
.modal p{color:var(--muted);margin:0 0 22px}
.modal .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#050910;border:1px solid var(--gold);padding:10px 16px;border-radius:10px;
  z-index:60;opacity:0;transition:.2s;font-size:13px;display:flex;gap:14px;align-items:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast button{background:none;border:0;color:var(--gold);font-weight:600;cursor:pointer}
.sample-flag{display:inline-block;font-size:9.5px;letter-spacing:.18em;color:#0A0E14;background:var(--amber);padding:3px 8px;border-radius:4px;font-weight:700;vertical-align:middle;margin-left:10px}
.hide{display:none!important}
.mt{margin-top:16px}
.muted{color:var(--muted)}
.right{text-align:right}
.serif{font-family:var(--serif)}
/* ---------- responsive ---------- */
@media (max-width:1280px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:1050px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g21,.g12,.g2{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .sb{position:fixed;z-index:40;left:0;top:0;transform:translateX(-100%);transition:.25s;box-shadow:20px 0 60px rgba(0,0,0,.6)}
  .sb.open{transform:none}
  .topbar{display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:30;background:rgba(7,11,17,.92);backdrop-filter:blur(10px);
    padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--gold-line);margin:-26px -34px 18px}
  .topbar button{background:none;border:1px solid var(--gold-line);border-radius:8px;width:38px;height:36px;color:var(--gold);font-size:18px}
  .topbar b{font-family:var(--serif);font-weight:400;font-size:17px}
  .main{padding:26px 16px 60px}.topbar{margin:-26px -16px 18px}
  .ph h1{font-size:28px}
}
@media (max-width:600px){.g6,.g3,.g4{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}.kpi .v{font-size:24px}.price-big{font-size:40px}
  .card{padding:14px}.gantt{grid-template-columns:minmax(110px,140px) repeat(12,minmax(26px,1fr));font-size:10.5px}}
@media print{.sb,.topbar,.ph .act,.toolbar{display:none!important}.main{padding:0}body{background:#070B11;-webkit-print-color-adjust:exact;print-color-adjust:exact}}
</style>
</head>
<body>
<div class="app">
  <aside class="sb" id="sb">
    <div class="brand">
      <svg class="mono" viewBox="0 0 40 40"><rect x="1" y="1" width="38" height="38" rx="3" fill="none" stroke="#C5A66A" stroke-width="1"/><rect x="5" y="5" width="30" height="30" rx="1.5" fill="none" stroke="#C5A66A" stroke-opacity=".35" stroke-width=".8"/><text x="20" y="26.5" text-anchor="middle" font-family="GFS Baskerville,Georgia,serif" font-size="17" fill="#C5A66A" letter-spacing="1">BA</text></svg>
